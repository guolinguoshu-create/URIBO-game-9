<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uribo Chototsu Moshin! v3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #121212; font-family: sans-serif; color: #fff; }
        
        #outer-container { width: 100vw; height: 100vh; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; background: #1e1e24; position: relative; }
        
        #game-header { width: 100%; height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; color: #FFD700; flex-shrink: 0; background: rgba(0,0,0,0.4); z-index: 30; }
        #game-header span { font-weight: bold; font-size: 14px; }
        #sound-toggle { font-size: 14px; background: #333; border: 1px solid #555; color: white; padding: 4px 10px; border-radius: 15px; cursor: pointer; }

        #canvas-wrapper { width: 100%; flex: 1; position: relative; overflow: hidden; background: #87CEEB; display: flex; flex-direction: column; }
        canvas { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; }

        #sky-score-board { position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); border: 2px solid rgba(255, 255, 255, 0.3); padding: 8px 14px; border-radius: 14px; text-align: right; pointer-events: none; z-index: 10; display: none; }
        .score-line { font-size: 12px; color: #EEE; font-weight: bold; }
        .score-val { font-size: 20px; color: #00E676; font-weight: 900; }
        .score-val.high { color: #FFD700; }

        #level-up-text { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(0.5); font-size: 34px; font-weight: 900; color: #FF5722; text-shadow: 2px 2px 0 #FFF, -2px -2px 0 #FFF, 2px -2px 0 #FFF, -2px 2px 0 #FFF; opacity: 0; pointer-events: none; z-index: 15; transition: all 0.3s ease; }
        #level-up-text.active { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        .ui-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; z-index: 20; }
        
        #start-screen { background: rgba(0,0,0,0.3); }
        
        input[type="text"] { width: 85%; max-width: 260px; padding: 12px 16px; font-size: 18px; border-radius: 25px; border: 3px solid #FF5722; background: rgba(0,0,0,0.9); color: #fff; text-align: center; margin-bottom: 16px; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        
        button.action-btn { padding: 16px 32px; font-size: 20px; font-weight: bold; background: #FF5722; color: white; border: none; border-radius: 35px; cursor: pointer; box-shadow: 0 5px #BF360C; width: 80%; max-width: 240px; z-index: 25; outline: none; }
        button.action-btn:active { transform: translateY(3px); box-shadow: 0 2px #BF360C; }

        #gameover-screen { background: rgba(0,0,0,0.85); display: none; }
        #gameover-screen h1 { font-size: 28px; margin-bottom: 8px; color: #FF5252; text-shadow: 2px 2px 4px #000; }
        #final-score-text { font-size: 22px; color: #00E676; margin-bottom: 16px; font-weight: bold; }
        .ranking-box { width: 90%; max-width: 320px; background: rgba(0,0,0,0.8); border: 2px solid rgba(255, 215, 0, 0.5); border-radius: 12px; padding: 12px; margin-bottom: 20px; font-size: 14px; text-align: left; }
        .ranking-title { font-weight: bold; color: #FFD700; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 4px; margin-bottom: 8px; text-align: center; }
        .ranking-item { display: flex; justify-content: space-between; padding: 4px 8px; }
        .ranking-item.me { background: rgba(255, 215, 0, 0.3); border-radius: 4px; font-weight: bold; color: #FFD700; }
    </style>
</head>
<body>

<div id="outer-container">
    <div id="game-header">
        <span>🌸 Uribo Chototsu Moshin!</span>
        <button id="sound-toggle">🔊</button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div id="sky-score-board">
            <div class="score-line">記録: <span class="score-val" id="current-score-disp">0m</span></div>
            <div class="score-line">ベスト: <span class="score-val high" id="high-score-disp">0m</span></div>
        </div>

        <div id="level-up-text">SPEED UP!! 💨</div>

        <div id="start-screen" class="ui-screen">
            <input type="text" id="player-name-input" placeholder="Name (お名前)" maxlength="10">
            <button class="action-btn" id="start-btn">ゲームスタート！</button>
        </div>

        <div id="gameover-screen" class="ui-screen">
            <h1>💥 激突 GAMEOVER!!</h1>
            <p id="final-score-text">走行距離: 0m</p>
            
            <div class="ranking-box">
                <div class="ranking-title">🏆 全国ランキング (TOP 5)</div>
                <div id="ranking-list"></div>
            </div>

            <button class="action-btn" id="restart-btn">もう一度挑戦！</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const wrapper = document.getElementById('canvas-wrapper');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = wrapper.clientWidth || window.innerWidth || 360;
    canvas.height = wrapper.clientHeight || window.innerHeight || 500;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const emojiCache = {};
function getEmojiCanvas(emoji) {
    if (emojiCache[emoji]) return emojiCache[emoji];
    const offCanvas = document.createElement('canvas');
    offCanvas.width = 60;
    offCanvas.height = 60;
    const offCtx = offCanvas.getContext('2d');
    offCtx.font = '42px sans-serif';
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    offCtx.fillText(emoji, 30, 30);
    emojiCache[emoji] = offCanvas;
    return offCanvas;
}

let audioCtx = null;
let isMuted = false;
let bgmTimer = null;
let bgmStep = 0;

const melody = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 880.00, 1046.50];
const bassNotes = [130.81, 174.61, 196.00, 130.81];

function initAudio() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
}

document.getElementById('sound-toggle').addEventListener('click', (e) => {
    e.stopPropagation();
    isMuted = !isMuted;
    document.getElementById('sound-toggle').innerText = isMuted ? '🔇' : '🔊';
    if (isMuted) stopBGM(); else if (gameState === 'PLAYING') startBGM();
});

function startBGM() {
    stopBGM();
    if (isMuted) return;
    bgmTimer = setInterval(() => {
        if (isMuted || !audioCtx || gameState !== 'PLAYING') return;
        try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(melody[bgmStep % melody.length], now);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.1);
            bgmStep++;
        } catch(e){}
    }, 140);
}

function stopBGM() {
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    bgmStep = 0;
}

function playJumpSound() {
    if (isMuted || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } catch(e){}
}

function playCrashSound() {
    if (isMuted || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    } catch(e){}
}

let gameState = 'START';
let score = 0;
let highScore = parseInt(localStorage.getItem('uribo_highscore') || '0');
let playerName = localStorage.getItem('uribo_playername') || '';
let gameSpeed = 5;
let animTimer = 0;
let shakeTimer = 0;
let nextLevelThreshold = 50;

let bgX = 0;
let obstacles = [];
let dustParticles = [];
let petals = [];

function initPetals() {
    petals = [];
    for (let i = 0; i < 25; i++) {
        petals.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 4 + 3,
            speedY: Math.random() * 1.2 + 0.6,
            speedX: Math.random() * 1.5 + 1.0,
            angle: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.05
        });
    }
}
initPetals();

function createDust() {
    dustParticles.push({
        x: player.x + 10,
        y: player.y + player.height - 5,
        vx: (Math.random() - 0.5) * 2 - gameSpeed * 0.5,
        vy: (Math.random() - 1) * 2,
        life: 1.0,
        size: Math.random() * 6 + 3
    });
}

document.getElementById('high-score-disp').innerText = `${highScore}m`;
const nameInputEl = document.getElementById('player-name-input');
if (playerName) nameInputEl.value = playerName;

const player = { x: 35, y: 0, width: 65, height: 45, vy: 0, gravity: 0.65, jumpPower: -12, isGrounded: false };

let spawnTimer = 0;
let nextSpawnDelay = 55;
const obstacleTypes = ['🍄', '🪨', '🪵', '🐍'];

function doJump() {
    if (gameState === 'PLAYING' && player.isGrounded) {
        player.vy = player.jumpPower;
        player.isGrounded = false;
        playJumpSound();
        for (let i = 0; i < 5; i++) createDust();
    }
}

// 画面どこをタップしてもジャンプできるようにする
wrapper.addEventListener('pointerdown', (e) => {
    if (gameState === 'PLAYING') {
        e.preventDefault();
        doJump();
    }
});

function startGame() {
    if (nameInputEl) nameInputEl.blur();
    initAudio();
    
    playerName = nameInputEl ? nameInputEl.value.trim() : '';
    if (!playerName) playerName = 'ウリボ';
    try { localStorage.setItem('uribo_playername', playerName); } catch(e) {}

    resizeCanvas();
    initPetals();
    score = 0;
    gameSpeed = 5;
    nextLevelThreshold = 50;
    bgX = 0;
    
    const groundY = canvas.height * 0.76;
    player.y = groundY - player.height;
    player.vy = 0;
    player.isGrounded = true;
    
    obstacles = [];
    dustParticles = [];
    spawnTimer = 0;
    shakeTimer = 0;
    gameState = 'PLAYING';
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('gameover-screen').style.display = 'none';
    document.getElementById('sky-score-board').style.display = 'block';
    
    startBGM();
}

// スタートボタン・リスタートボタンの確実なバインド
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');

[startBtn, restartBtn].forEach(btn => {
    btn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        startGame();
    });
});

nameInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        startGame();
    }
});

function update() {
    petals.forEach(p => {
        p.x -= p.speedX + (gameState === 'PLAYING' ? gameSpeed * 0.2 : 0.4); 
        p.y += p.speedY;
        p.angle += p.spin;
        if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
        if (p.x < -20) { p.x = canvas.width + 20; p.y = Math.random() * canvas.height; }
    });

    if (gameState !== 'PLAYING') return;

    score += 0.15;
    gameSpeed = 5 + (score / 40);
    animTimer += 0.2;
    bgX -= gameSpeed;
    
    const roundedScore = Math.floor(score);
    document.getElementById('current-score-disp').innerText = `${roundedScore}m`;

    if (roundedScore >= nextLevelThreshold) {
        nextLevelThreshold += 50;
        const levelText = document.getElementById('level-up-text');
        levelText.classList.add('active');
        setTimeout(() => { levelText.classList.remove('active'); }, 1000);
    }

    if (roundedScore > highScore) {
        highScore = roundedScore;
        try { localStorage.setItem('uribo_highscore', highScore); } catch(e) {}
        document.getElementById('high-score-disp').innerText = `${highScore}m`;
    }

    const groundY = canvas.height * 0.76;
    const floorY = groundY - player.height;

    player.vy += player.gravity;
    player.y += player.vy;

    if (player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.isGrounded = true;
        if (Math.random() > 0.4) createDust();
    }

    for (let i = dustParticles.length - 1; i >= 0; i--) {
        let p = dustParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) dustParticles.splice(i, 1);
    }

    spawnTimer++;
    if (spawnTimer >= nextSpawnDelay) {
        const emoji = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
        obstacles.push({
            x: canvas.width,
            y: groundY - 42,
            width: 42,
            height: 42,
            emoji: emoji
        });
        spawnTimer = 0;
        const minDelay = Math.max(25, 55 - Math.floor(gameSpeed * 1.5));
        nextSpawnDelay = Math.floor(Math.random() * 25) + minDelay;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        const hitMargin = 10;
        if (
            player.x + hitMargin < obs.x + obs.width - hitMargin &&
            player.x + player.width - hitMargin > obs.x + hitMargin &&
            player.y + hitMargin < obs.y + obs.height - hitMargin &&
            player.y + player.height > obs.y + hitMargin
        ) {
            gameState = 'GAMEOVER';
            shakeTimer = 12;
            stopBGM();
            playCrashSound();
            document.getElementById('final-score-text').innerText = `走行距離: ${roundedScore}m`;
            
            try {
                let rankings = JSON.parse(localStorage.getItem('uribo_rankings') || '[]');
                rankings.push({ name: playerName, score: roundedScore });
                rankings.sort((a, b) => b.score - a.score);
                rankings = rankings.slice(0, 5);
                localStorage.setItem('uribo_rankings', JSON.stringify(rankings));
                
                const listEl = document.getElementById('ranking-list');
                listEl.innerHTML = '';
                rankings.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = `ranking-item ${(item.name === playerName && item.score === roundedScore) ? 'me' : ''}`;
                    div.innerHTML = `<span>${idx + 1}. ${item.name}</span><span>${item.score}m</span>`;
                    listEl.appendChild(div);
                });
            } catch(e){}

            document.getElementById('gameover-screen').style.display = 'flex';
        }
        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
    }
}

function drawUribo(x, y, w, h, isGrounded, vy) {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    if (!isGrounded) {
        ctx.rotate(Math.min(Math.max(vy * 0.03, -0.3), 0.5));
    } else {
        ctx.translate(0, Math.sin(animTimer) * 2.5);
    }

    ctx.fillStyle = '#C87533';
    ctx.beginPath();
    ctx.ellipse(0, 4, w * 0.42, h * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-4, -10); ctx.lineTo(-4, 10);
    ctx.moveTo(7, -8); ctx.lineTo(7, 8);
    ctx.stroke();

    ctx.fillStyle = '#C87533';
    ctx.beginPath();
    ctx.arc(-w * 0.24, -2, w * 0.26, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-w * 0.3, -5, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function draw() {
    ctx.save();
    if (shakeTimer > 0) {
        shakeTimer--;
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.76);
    skyGrad.addColorStop(0, '#4A90E2');
    skyGrad.addColorStop(1, '#87CEEB');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height * 0.76);

    ctx.fillStyle = '#558B2F';
    ctx.beginPath();
    const mountainOffset = (bgX * 0.25) % canvas.width;
    ctx.moveTo(-mountainOffset, canvas.height * 0.76);
    ctx.lineTo(canvas.width * 0.5 - mountainOffset, canvas.height * 0.48);
    ctx.lineTo(canvas.width - mountainOffset, canvas.height * 0.76);
    ctx.fill();

    const groundY = canvas.height * 0.76;
    const groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
    groundGrad.addColorStop(0, '#7CB342');
    groundGrad.addColorStop(1, '#558B2F');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    dustParticles.forEach(p => {
        ctx.fillStyle = `rgba(180, 130, 80, ${p.life * 0.7})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    obstacles.forEach(obs => {
        const cachedCanvas = getEmojiCanvas(obs.emoji);
        ctx.drawImage(cachedCanvas, Math.floor(obs.x), Math.floor(obs.y), obs.width, obs.height);
    });

    if (gameState !== 'START') {
        drawUribo(player.x, player.y, player.width, player.height, player.isGrounded, player.vy);
    }

    petals.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = 'rgba(255, 183, 197, 0.85)';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    ctx.restore();
}

function loop() {
    try {
        update();
        draw();
    } catch(e) {}
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
