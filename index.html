<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uribo Chototsu Moshin!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #121212; font-family: 'Hiragino Kaku Gothic ProN', sans-serif; color: #fff; }
        
        #outer-container { width: 100vw; height: 100vh; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; background: #1e1e24; position: relative; }
        
        #game-header { width: 100%; height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; color: #FFD700; flex-shrink: 0; background: rgba(0,0,0,0.3); z-index: 30; }
        #game-header span { font-weight: bold; font-size: 13px; text-shadow: 1px 1px 2px #000; }
        #sound-toggle { font-size: 12px; background: #333; border: 1px solid #555; color: white; padding: 2px 8px; border-radius: 15px; cursor: pointer; }

        #canvas-wrapper { width: 100%; flex: 1; position: relative; overflow: hidden; background: #87CEEB; }
        canvas { width: 100%; height: 100%; display: block; }

        #sky-score-board { position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); border: 2px solid rgba(255, 255, 255, 0.3); padding: 8px 14px; border-radius: 14px; text-align: right; pointer-events: none; z-index: 10; display: none; }
        .score-line { font-size: 13px; color: #EEE; font-weight: bold; }
        .score-val { font-size: 22px; color: #00E676; font-weight: 900; }
        .score-val.high { color: #FFD700; }

        #level-up-text { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.5); font-size: 36px; font-weight: 900; color: #FF5722; text-shadow: 2px 2px 0 #FFF, -2px -2px 0 #FFF, 2px -2px 0 #FFF, -2px 2px 0 #FFF; opacity: 0; pointer-events: none; z-index: 15; transition: all 0.3s ease; }
        #level-up-text.active { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        .ui-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; color: white; text-align: center; padding: 16px; z-index: 20; }
        
        #start-screen { background: transparent; justify-content: flex-start; padding-top: 66%; }
        
        input[type="text"] { width: 80%; max-width: 230px; padding: 10px 14px; font-size: 16px; border-radius: 20px; border: 2px solid #FF5722; background: rgba(0,0,0,0.85); color: #fff; text-align: center; margin-bottom: 14px; outline: none; user-select: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        button.action-btn { padding: 14px 28px; font-size: 18px; font-weight: bold; background: #FF5722; color: white; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px #BF360C; width: 75%; max-width: 200px; z-index: 25; outline: none; }
        button.action-btn:active { transform: translateY(2px); box-shadow: 0 2px #BF360C; }

        #gameover-screen { background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; padding-bottom: 32%; }
        
        #gameover-screen h1 { font-size: 26px; margin-bottom: 6px; color: #FF5252; text-shadow: 2px 2px 4px #000; }
        #final-score-text { font-size: 20px; color: #00E676; margin-bottom: 14px; font-weight: bold; }
        .ranking-box { width: 92%; max-width: 320px; background: rgba(0,0,0,0.75); border: 2px solid rgba(255, 215, 0, 0.5); border-radius: 12px; padding: 12px; margin-bottom: 16px; font-size: 14px; text-align: left; }
        .ranking-title { font-weight: bold; color: #FFD700; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 6px; margin-bottom: 8px; text-align: center; }
        .ranking-item { display: flex; justify-content: space-between; padding: 4px 6px; }
        .ranking-item.me { background: rgba(255, 215, 0, 0.3); border-radius: 4px; font-weight: bold; color: #FFD700; }
    </style>
</head>
<body>

<div id="outer-container">
    <div id="game-header">
        <span>🌸 Uribo Chototsu Moshin!</span>
        <button id="sound-toggle" onclick="toggleSound(event)">🔊</button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div id="sky-score-board">
            <div class="score-line">記録: <span class="score-val" id="current-score-disp">0m</span></div>
            <div class="score-line">ベスト: <span class="score-val high" id="high-score-disp">0m</span></div>
        </div>

        <div id="level-up-text">SPEED UP!! 💨</div>

        <div id="start-screen" class="ui-screen">
            <input type="text" id="player-name-input" placeholder="名前を入力" maxlength="10">
            <button class="action-btn" id="start-btn" onclick="startGame(event)">ゲームスタート！</button>
        </div>

        <div id="gameover-screen" class="ui-screen">
            <h1>💥 激突 GAMEOVER!!</h1>
            <p id="final-score-text">走行距離: 0m</p>
            
            <div class="ranking-box">
                <div class="ranking-title">🏆 ハイスコアランキング (TOP 5)</div>
                <div id="ranking-list"></div>
            </div>

            <button class="action-btn" id="restart-btn" onclick="startGame(event)">もう一度挑戦！</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const wrapper = document.getElementById('canvas-wrapper');
const ctx = canvas.getContext('2d');

let logicalWidth = 360;
let logicalHeight = 500;

function resizeCanvas() {
    logicalWidth = wrapper.clientWidth || 360;
    logicalHeight = wrapper.clientHeight || 500;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = logicalWidth * dpr;
    canvas.height = logicalHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const uriboImg = new Image(); uriboImg.src = 'uribo.png'; 
const topBgImg = new Image(); topBgImg.src = 'top.png'; 
const gameBgImg = new Image(); gameBgImg.src = 'bg.png'; 

let audioCtx = null;
let isMuted = false;
let bgmTimer = null;
let bgmStep = 0;

const melody = [
    523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 880.00, 1046.50,
    698.46, 880.00, 1046.50, 1318.51, 1046.50, 880.00, 783.99, 659.25
];
const bassNotes = [130.81, 130.81, 174.61, 174.61, 196.00, 196.00, 130.81, 196.00];

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function toggleSound(e) {
    if (e) e.stopPropagation();
    isMuted = !isMuted;
    document.getElementById('sound-toggle').innerText = isMuted ? '🔇' : '🔊';
    if (isMuted) stopBGM(); else if (gameState === 'PLAYING') startBGM();
}

function startBGM() {
    stopBGM();
    if (isMuted) return;
    bgmTimer = setInterval(() => {
        if (isMuted || !audioCtx || gameState !== 'PLAYING') return;
        try {
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(melody[bgmStep % melody.length], now);
            gain.gain.setValueAtTime(0.025, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.11);

            const bassOsc = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bassOsc.type = 'sawtooth';
            bassOsc.frequency.setValueAtTime(bassNotes[Math.floor(bgmStep / 2) % bassNotes.length], now);
            bassGain.gain.setValueAtTime(0.035, now);
            bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            bassOsc.connect(bassGain); bassGain.connect(audioCtx.destination);
            bassOsc.start(now); bassOsc.stop(now + 0.12);

            bgmStep++;
        } catch(e){}
    }, 130);
}

function stopBGM() {
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    bgmStep = 0;
}

function playJumpSound() {
    if (isMuted || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    } catch(e){}
}

function playCrashSound() {
    if (isMuted || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } catch(e){}
}

let gameState = 'START';
let score = 0;
let highScore = parseInt(localStorage.getItem('uribo_highscore') || '0');
let playerName = localStorage.getItem('uribo_playername') || '';
let gameSpeed = 5;
let animTimer = 0;
let shakeTimer = 0;
let nextLevelThreshold = 50;

let bgX = 0;
let obstacles = [];
let dustParticles = [];
let petals = [];

function initPetals() {
    petals = [];
    for (let i = 0; i < 35; i++) {
        petals.push({
            x: Math.random() * logicalWidth,
            y: Math.random() * logicalHeight,
            size: Math.random() * 5 + 4,
            speedY: Math.random() * 1.5 + 0.8,
            speedX: Math.random() * 2 + 1.2,
            angle: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.08
        });
    }
}
initPetals();

function createDust() {
    dustParticles.push({
        x: player.x + 10,
        y: player.y + player.height - 8,
        vx: (Math.random() - 0.5) * 3 - gameSpeed * 0.6,
        vy: (Math.random() - 1) * 2.5,
        life: 1.0,
        size: Math.random() * 7 + 4
    });
}

document.getElementById('high-score-disp').innerText = `${highScore}m`;
if (playerName) document.getElementById('player-name-input').value = playerName;

const player = {
    x: 35, y: 0, width: 70, height: 50, vy: 0, gravity: 0.7, jumpPower: -13, isGrounded: false
};

let spawnTimer = 0;
let nextSpawnDelay = 50;
const obstacleTypes = ['mushroom', 'rock', 'log', 'stump'];

function doJump() {
    if (gameState === 'PLAYING' && player.isGrounded) {
        player.vy = player.jumpPower;
        player.isGrounded = false;
        playJumpSound();
        for (let i = 0; i < 6; i++) createDust();
    }
}

wrapper.addEventListener('pointerdown', (e) => {
    if (gameState === 'PLAYING') {
        e.preventDefault();
        doJump();
    }
});

function updateRankings(name, currentScore) {
    try {
        let rankings = JSON.parse(localStorage.getItem('uribo_rankings') || '[]');
        rankings.push({ name: name, score: currentScore });
        rankings.sort((a, b) => b.score - a.score);
        rankings = rankings.slice(0, 5);
        localStorage.setItem('uribo_rankings', JSON.stringify(rankings));
        
        const listEl = document.getElementById('ranking-list');
        listEl.innerHTML = '';
        rankings.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = `ranking-item ${(item.name === name && item.score === currentScore) ? 'me' : ''}`;
            div.innerHTML = `<span>${idx + 1}位: ${item.name}</span><span>${item.score}m</span>`;
            listEl.appendChild(div);
        });
    } catch(e){}
}

function startGame(e) {
    if (e) {
        e.stopPropagation();
        e.preventDefault();
    }
    initAudio();
    
    const inputEl = document.getElementById('player-name-input');
    playerName = inputEl ? inputEl.value.trim() : '名無しウリボ';
    if (!playerName) playerName = '名無しウリボ';
    try { localStorage.setItem('uribo_playername', playerName); } catch(e) {}

    resizeCanvas();
    initPetals();
    score = 0;
    gameSpeed = 5;
    nextLevelThreshold = 50;
    bgX = 0;
    
    const groundY = logicalHeight * 0.76;
    player.y = groundY - player.height;
    player.vy = 0;
    player.isGrounded = true;
    
    obstacles = [];
    dustParticles = [];
    spawnTimer = 0;
    shakeTimer = 0;
    gameState = 'PLAYING';
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('gameover-screen').style.display = 'none';
    document.getElementById('sky-score-board').style.display = 'block';
    
    startBGM();
}

function update() {
    petals.forEach(p => {
        p.x -= p.speedX + (gameState === 'PLAYING' ? gameSpeed * 0.25 : 0.5); 
        p.y += p.speedY;
        p.angle += p.spin;
        if (p.y > logicalHeight) { p.y = -10; p.x = Math.random() * logicalWidth + 50; }
        if (p.x < -20) { p.x = logicalWidth + 20; p.y = Math.random() * logicalHeight; }
    });

    if (gameState !== 'PLAYING') return;

    score += 0.15;
    gameSpeed = 5 + (score / 45);
    animTimer += 0.25;
    bgX -= gameSpeed;
    
    const roundedScore = Math.floor(score);
    document.getElementById('current-score-disp').innerText = `${roundedScore}m`;

    if (roundedScore >= nextLevelThreshold) {
        nextLevelThreshold += 50;
        const levelText = document.getElementById('level-up-text');
        levelText.classList.add('active');
        setTimeout(() => { levelText.classList.remove('active'); }, 1200);
    }

    if (roundedScore > highScore) {
        highScore = roundedScore;
        try { localStorage.setItem('uribo_highscore', highScore); } catch(e) {}
        document.getElementById('high-score-disp').innerText = `${highScore}m`;
    }

    const groundY = logicalHeight * 0.76;
    const floorY = groundY - player.height;

    player.vy += player.gravity;
    player.y += player.vy;

    if (player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.isGrounded = true;
        if (Math.random() > 0.3) createDust();
    }

    for (let i = dustParticles.length - 1; i >= 0; i--) {
        let p = dustParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) dustParticles.splice(i, 1);
    }

    spawnTimer++;
    if (spawnTimer >= nextSpawnDelay) {
        const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
        obstacles.push({
            x: logicalWidth,
            y: groundY - 40,
            width: 40,
            height: 40,
            type: type
        });
        spawnTimer = 0;
        const minDelay = Math.max(25, 55 - Math.floor(gameSpeed * 2));
        nextSpawnDelay = Math.floor(Math.random() * 30) + minDelay;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        const hitMargin = 10;
        if (
            player.x + hitMargin < obs.x + obs.width - hitMargin &&
            player.x + player.width - hitMargin > obs.x + hitMargin &&
            player.y + hitMargin < obs.y + obs.height - hitMargin &&
            player.y + player.height > obs.y + hitMargin
        ) {
            gameState = 'GAMEOVER';
            shakeTimer = 15;
            stopBGM();
            playCrashSound();
            document.getElementById('final-score-text').innerText = `走行距離: ${roundedScore}m`;
            
            updateRankings(playerName, roundedScore);

            document.getElementById('gameover-screen').style.display = 'flex';
        }
        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
    }
}

function draw() {
    ctx.save();
    
    if (shakeTimer > 0) {
        shakeTimer--;
        ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
    }

    ctx.clearRect(0, 0, logicalWidth, logicalHeight);

    const currentBg = (gameState === 'START') ? topBgImg : gameBgImg;

    if (currentBg.complete && currentBg.naturalWidth > 0) {
        if (gameState === 'PLAYING') {
            const bgAspect = currentBg.naturalWidth / currentBg.naturalHeight;
            const bgWidth = logicalHeight * bgAspect;
            
            const scrollPos = -bgX;
            const firstTileIndex = Math.floor(scrollPos / bgWidth);
            const startX = -(scrollPos % bgWidth);

            let drawX = startX;
            let tileIndex = firstTileIndex;

            while (drawX < logicalWidth) {
                ctx.save();
                if (Math.abs(tileIndex) % 2 === 1) {
                    ctx.translate(drawX + bgWidth, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(currentBg, 0, 0, bgWidth + 1, logicalHeight);
                } else {
                    ctx.drawImage(currentBg, drawX, 0, bgWidth + 1, logicalHeight);
                }
                ctx.restore();
                
                drawX += bgWidth;
                tileIndex++;
            }
        } else {
            ctx.drawImage(currentBg, 0, 0, logicalWidth, logicalHeight);
        }
    } else {
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        ctx.fillStyle = '#8BC34A'; ctx.fillRect(0, logicalHeight * 0.76, logicalWidth, logicalHeight * 0.24);
    }

    dustParticles.forEach(p => {
        ctx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.75})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // 障害物を完全不透明な「図形」として直接描画（絵文字フォント不使用のため点滅ゼロ）
    ctx.save();
    obstacles.forEach(obs => {
        let cx = Math.round(obs.x + obs.width / 2);
        let cy = Math.round(obs.y + obs.height / 2);

        if (obs.type === 'mushroom') {
            // キノコ
            ctx.fillStyle = '#D7CCC8'; // 軸
            ctx.fillRect(cx - 5, cy, 10, 15);
            ctx.fillStyle = '#E53935'; // カサ
            ctx.beginPath();
            ctx.arc(cx, cy, 16, Math.PI, 0, false);
            ctx.fill();
            // カサの白ドット
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(cx - 6, cy - 8, 3, 0, Math.PI * 2);
            ctx.arc(cx + 6, cy - 5, 2.5, 0, Math.PI * 2);
            ctx.fill();
        } else if (obs.type === 'rock') {
            // 岩
            ctx.fillStyle = '#78909C';
            ctx.beginPath();
            ctx.moveTo(cx - 16, cy + 14);
            ctx.lineTo(cx - 12, cy - 6);
            ctx.lineTo(cx, cy - 16);
            ctx.lineTo(cx + 14, cy - 4);
            ctx.lineTo(cx + 18, cy + 14);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#37474F';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else if (obs.type === 'log') {
            // 切り株・丸太
            ctx.fillStyle = '#8D6E63';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 4, 18, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#4E342E';
            ctx.lineWidth = 2;
            ctx.stroke();
            // 年輪
            ctx.beginPath();
            ctx.ellipse(cx, cy + 4, 9, 6, 0, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            // 石ころ（デフォルト）
            ctx.fillStyle = '#9E9E9E';
            ctx.beginPath();
            ctx
